<html lang="en">

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EuroEnergyVis</title>

    <link rel="stylesheet" href="styles.css" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <link href="nouislider.min.css" rel="stylesheet" />

</head>
<body>

    <!-------------------- Shows the map -------------------->
    <div id="map-container" style="background-color:#EEEEEE;">
        <div id="map" style="height: 100%;"></div>
        <!-- <iframe src="init_map0.html" style="width: 100%; height: 100%;"></iframe> -->
        <!-- <iframe id="mapFrame" src="{{ url_for('static', filename='init_map.html') }}"  style="width: 100%; height: 100%;"></iframe> -->

    </div>

    <!-------------------- Setting neighor number and range -------------------->
    <div id="setting" style="background-color:#f7f7f7; ">
        <div id = "setNei">
            <label for="neighborCount">Reload and Change Number of Nearest Neighbors:  </label>
            <!-- <input type="number" id="numTargets" value="3" min="1" step="1" onchange="handleFile()" style="width: 50px;"><br/> -->
            <input type="number" id="numTargets" value="3" min="1" step="1"  style="width: 50px;"><br/>
        </div>

        <!-- <div id="chartsContainer" style="display: flex; flex-wrap: wrap; gap: 20px;"></div> -->

        <!-- a range slider-->
        <div id="slider-container">
            <div id="formatting-slider"></div><br/>
    
            <div id="forValues">Hi</div>
        
            <!-- <div id="slider-margin-value-min">0.00</div>
            <div id="slider-margin-value-max">38889.00</div> -->
        </div>
    </div>

    <!-------------------- Button to select the content -------------------->
    <div id="buttonContainer">

        <button onclick="showDiv('infoContainer')" class="button blue" >Plant Information</button>
        <button onclick="showDiv('search-container')" class="button">Search Plants</button>
        <button onclick="showDiv('chartContainer')" class="button">Country Information</button>

        <br/>
    </div>

    <!-------------------- Shows detail info or Search a plant -------------------->
    <div id="display-container" style="background-color: #f7f7f7;">
        
        <!-- Here is the details of plants -->
        <div id="infoContainer">

            <!-- graph -->
            <div id="powerPlantTable">
                <canvas id="myChart"  width="100%" height="75%"></canvas>
                <button onclick="clearChart()">Clear Chart</button>

            </div>
            <!-- <div id="unit">The unit is GWh</div> -->

            <br/>

            <!-- text -->
            <div id="textContainers">
                <!-- <div id="contLabel"><b>Details:</b></div> -->
                <div id="contLabel" style="font-weight: bold; padding: 5px">Details:</div>
                <div id="detaContainer"></div>
                <div id="neigContainer"></div>
            </div>
            <!-- Legend container
            <div id="legend" style="position: absolute; top: 10px; right: 10px; background-color: white; padding: 10px; border: 1px solid #ccc; border-radius: 5px;"></div> -->
        </div>


        <!-- Here is the searching part -->
        <div id="search-container"     style="background-color:#f3f3f3;">
            <input type="text" id="searchInput" placeholder="Search specific plants...">
            <button onclick="performSearch()" id="searchButton">Find</button>
            <div id="searchResults">Shows the results...</div>
        </div>

        <!-- Here is a chart shows the details of the country-->
        <div id="chartContainer"  class="chart-container" style="background-color:#f3f3f3;">
            <div class="buttons">
                <button id="selectAll">Select All</button>
                <button id="deselectAll">Deselect All</button>
            </div>
            <table id="countryTable">
                <thead>
                    <tr>
                        <th id="sortCountry">Country<span class="sort-arrow"></span></th>
                        <th>Select</th>
                        <th id="sortGeneration">Total Generation (GWh)<span class="sort-arrow"></span></th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Table rows will be populated dynamically -->
                </tbody>
            </table>
        </div>

    </div>


    <!-------------------- Seperate left and right -------------------->
    <div class="middle-divider"></div>
